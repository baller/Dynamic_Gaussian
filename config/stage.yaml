name: 'gps_plus'

lr: 0.0002
wdecay: 1e-5
batch_size: 1
num_steps: 100000

dataset:
  source_id: [0, 1]
  train_novel_id: [2, 3, 4, 5]
  val_novel_id: [2, 3]
  use_hr_img: False
  use_depth_init: True
  use_local_data: True
  inverse_depth_init: 0.3
  local_data_root: '/data/GPS_plus/processed_data'       # TODO
  train_data_root: '/data/GPS_plus/processed_data/train' # TODO
  val_data_root: '/data/GPS_plus/processed_data/val'     # TODO

raft:
  mixed_precision: False
  train_iters: 3
  val_iters: 3
  encoder_dims: [32, 48, 96]  
  hidden_dims: [96, 96, 96]  

# Depth Anything V3 configuration (正确的实现)
da3:
  # Model configuration
  model_name: '/home/user_3/.cache/huggingface/hub/models--depth-anything--DA3-LARGE/snapshots/c54c26b16ec04d218e8d584ecf4bce082a9fcc20/model.safetensors'  # HuggingFace 模型名
  export_feat_layers: [11, 15, 19, 23]  # 导出的特征层
  freeze_backbone: True  # 是否冻结 DA3 参数
  mixed_precision: False  # 是否使用混合精度

# Depth alignment parameters
depth_align:
  typical_disp_min_ratio: 0.01  # 典型最小视差 (图像宽度的比例)
  typical_disp_max_ratio: 0.15  # 典型最大视差 (图像宽度的比例)

gsnet:
  encoder_dims: [32, 48, 96]
  decoder_dims: [48, 64, 96]
  parm_head_dim: 32

record:
  loss_freq: 20
  eval_freq: 100
