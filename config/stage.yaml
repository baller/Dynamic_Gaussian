name: 'gps_plus_transformer_debug'

lr: 0.0002
wdecay: 1e-5
batch_size: 1
num_steps: 100000

dataset:
  source_id: [0, 1]
  train_novel_id: [2, 3, 4, 5]
  val_novel_id: [2, 3]
  use_hr_img: False
  use_depth_init: True
  use_local_data: True
  inverse_depth_init: 0.3
  local_data_root: '/data/GPS_plus/processed_data'       # TODO
  train_data_root: '/data/GPS_plus/processed_data/train' # TODO
  val_data_root: '/data/GPS_plus/processed_data/val'     # TODO

raft:
  mixed_precision: False
  train_iters: 3
  val_iters: 3
  encoder_dims: [32, 48, 96]  
  hidden_dims: [96, 96, 96]  

# Depth Anything V3 configuration
# 使用 DA3-METRIC-LARGE 直接输出绝对深度，无需复杂的对齐
da3:
  # Model configuration
  # 选项: 
  #   - 'depth-anything/DA3-LARGE' (相对深度，需要对齐)
  #   - 'depth-anything/DA3METRIC-LARGE' (绝对深度，推荐)
  model_name: 'depth-anything/DA3METRIC-LARGE'  # Metric 模型直接输出绝对深度
  export_feat_layers: [11, 15, 19, 23]  # 导出的特征层
  freeze_backbone: True  # 是否冻结 DA3 参数
  mixed_precision: True  # 是否使用混合精度
  local_files_only: False  # 是否只使用本地文件 (首次使用需设为 False 下载模型)

# Depth alignment parameters (块匹配极线搜索)
depth_align:
  num_keypoints: 500      # 选取的关键点数量
  patch_size: 11          # 匹配窗口大小
  max_disparity: 128      # 最大视差搜索范围
  min_depth: 0.1          # 最小深度
  max_depth: 100.0        # 最大深度

gsnet:
  encoder_dims: [32, 48, 96]
  decoder_dims: [48, 64, 96]
  parm_head_dim: 32
  # GSTransformer 配置 (交替注意力 + DPT Head)
  use_transformer: True  # 设为 True 启用 Transformer 架构
  transformer_embed_dim: 1024
  transformer_depth: 8
  transformer_num_heads: 16
  transformer_patch_size: 14
  transformer_mlp_ratio: 4.0
  transformer_use_checkpoint: True  # Gradient Checkpointing 节省 ~50% 显存

record:
  loss_freq: 20
  eval_freq: 100
  save_iter: [5000, 10000, 20000, 30000, 50000, 80000]  # Save checkpoint at these iterations

# Resume training from checkpoint
# Options:
#   - null: Start training from scratch
#   - 'path/to/checkpoint.pth': Resume from specific checkpoint
#   - Use --resume argument in command line for more flexibility
restore_ckpt: '/home/user_3/3DGS/GPS_plus/experiments/gps_plus_transformer_debug_dav3_0203/ckpt/iter20000.pth'

# Stage 1 checkpoint (for stage 2 training, load weights without optimizer state)
stage1_ckpt: null
