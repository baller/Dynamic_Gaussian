# 实验名称前缀（最终名称格式: {name}_{depth_mode}_{moe}_{gpu数}_{时间戳}）
name: 'dino-based-moe'

lr: 0.00005
wdecay: 1e-5
batch_size: 1
num_steps: 500000

# 深度估计模式: 'raft' 或 'da3'
depth_mode: 'da3'

dataset:
  source_id: [0, 1]
  train_novel_id: [2, 3, 4, 5]
  val_novel_id: [2, 3]
  use_hr_img: False
  use_depth_init: True
  use_local_data: True
  inverse_depth_init: 0.3
  local_data_root: '/data/GPS_plus/processed_data'       # TODO
  train_data_root: '/data/GPS_plus/processed_data/train' # TODO
  val_data_root: '/data/GPS_plus/processed_data/val'     # TODO
  bg_color: [0, 0, 0]
  znear: 0.01
  zfar: 100.0
  trans: [0.0, 0.0, 0.0]
  scale: 1.0

# RAFT-Stereo配置（当depth_mode='raft'时使用）
raft:
  mixed_precision: False
  train_iters: 3
  val_iters: 3
  encoder_dims: [32, 48, 96]  
  hidden_dims: [96, 96, 96]
  n_downsample: 3
  n_gru_layers: 3
  slow_fast_gru: False
  corr_implementation: 'reg'
  corr_radius: 4
  corr_levels: 4
  context_norm: 'batch'

# DA3配置（当depth_mode='da3'时使用）
da3:
  # DA3模型名称，支持:
  # - "depth-anything/DA3-SMALL"
  # - "depth-anything/DA3-BASE"
  # - "depth-anything/DA3-LARGE"
  # - "depth-anything/DA3-GIANT"
  # - "depth-anything/DA3NESTED-GIANT-LARGE"
  # - "depth-anything/DA3METRIC-LARGE"
  model_name: 'depth-anything/DA3-LARGE'
  
  # DA3模式: 'single' 单目模式，'dual' 双目模式
  mode: 'single'
  
  # 是否使用LoFTR进行特征匹配（用于高斯参数预测）
  # 注意: 当moe.expert_type='transformer'时，此项自动忽略
  use_loftr: False
  
  # 是否微调DA3模型
  finetune: False
  
  # 是否使用混合精度
  mixed_precision: True
  
  # 深度尺度因子（用于调整DA3输出的深度范围）
  scale_factor: 1.0
  
  # 是否使用metric深度模型
  use_metric: False
  
  # DINO特征导出配置（用于Transformer MoE模式）
  # 当moe.expert_type='transformer'时自动启用
  export_features: True
  feature_layer: 11  # 导出的DINO层索引（0-23，11为中层语义特征）

# 高斯网络配置
gsnet:
  encoder_dims: [32, 48, 96]
  decoder_dims: [48, 64, 96]
  parm_head_dim: 32

# MoE配置（动静分离 + 共享专家）
moe:
  # 是否启用MoE模式
  enabled: true
  
  # 路由专家数量（不包括共享专家）
  # 例如: num_experts=2 表示2个路由专家（如背景+人体）
  # 注意: 每增加一个专家会显著增加显存占用
  num_experts: 2
  
  # 是否使用共享专家
  # 共享专家的输出会与所有路由专家的输出融合
  use_shared_expert: true
  
  # 共享专家权重（0-1之间，表示共享专家在最终输出中的占比）
  shared_expert_weight: 0.3
  
  # 专家类型: 'cnn' 或 'transformer'
  # - 'cnn': 使用CNN专家（传统模式，需要UNet编码器）
  # - 'transformer': 使用Transformer专家（使用DA3 DINO特征）
  expert_type: 'transformer'
  
  # 路由器类型: 'basic', 'multiscale', 'depth_aware'
  # 注意: 当expert_type='transformer'时，使用内置的DINO特征路由器
  router_type: 'basic'
  
  # 路由器隐藏层通道数
  router_channels: 64
  
  # 是否使用软路由
  soft_routing: true
  
  # 是否共享深度编码器（所有专家共享）
  share_depth_encoder: true
  
  # Transformer专家配置（当expert_type='transformer'时使用）
  transformer:
    dim_hidden: 512  # Transformer隐藏层维度
    num_heads: 8     # 注意力头数
    num_layers: 4    # Transformer层数
    dropout: 0.1     # Dropout率
  
  # 高斯分配配置
  allocation:
    total_gaussians: 1048576  # 1024*1024 = 约100万高斯点
    min_ratio: 0.1
    learnable: true
  
  # 背景缓存配置
  bg_cache:
    enabled: true
    update_threshold: 22.0  # PSNR阈值
    min_update_interval: 1
    quality_metric: 'psnr'
    momentum: 0.0
  
  # 损失配置
  loss:
    sparsity_weight: 0.1
    temporal_weight: 0.05
    balance_weight: 0.01
    separation_weight: 0.01
    target_bg_ratio: 0.3
  
  # 训练配置
  training:
    freeze_router_epochs: 0.2
    progressive: true
    
    # 课程学习配置（Transformer MoE模式使用）
    # 控制训练过程中bg_update_signal的采样概率
    curriculum:
      warmup_steps: 10000   # 预热步数：100%有背景更新信号
      decay_steps: 40000    # 衰减步数：信号概率从100%线性衰减到min_bg_prob
      min_bg_prob: 0.3      # 最终维持的背景更新信号概率

# 记录配置
record:
  loss_freq: 50
  eval_freq: 500
  save_iter: 5000
