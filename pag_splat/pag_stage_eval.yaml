name: 'pag_splat_eval'

lr: 0.0002
wdecay: 1e-5
batch_size: 1
num_steps: 500000

# 深度估计模式 (pagsplat 固定为 'pagsplat'，保留字段供 config schema 兼容)
depth_mode: 'pagsplat'

# ───────────────────────────────────────────────
# 数据集配置
# ───────────────────────────────────────────────
dataset:
  # ── 旧 GPS+ 兼容字段（保留供 StereoHumanDataset 使用，PAGMultiDataset 不依赖）──
  source_id: [0, 1]
  train_novel_id: [2, 3, 4, 5]
  val_novel_id: [2, 3]
  use_hr_img: False
  use_depth_init: False
  use_local_data: True
  inverse_depth_init: 0.3
  local_data_root: '/data/sifang/GPS_plus_data/processed_data'
  train_data_root: '/data/sifang/GPS_plus_data/processed_data/train'
  val_data_root:   '/data/sifang/GPS_plus_data/processed_data/val'
  bg_color: [0, 0, 0]
  znear: 0.01
  zfar: 100.0
  trans: [0.0, 0.0, 0.0]
  scale: 1.0

  # ── 多数据集混合训练（PAGMultiDataset） ──────────────────────────────
  # 列表长度需与 multi_formats 保持一致。
  # 格式 "mini"  → cameras.json，随机选 3 个视角
  # 格式 "legacy"→ 0_1.json + npy，固定 source=0,1，novel 从 legacy_novel_ids 随机选
  # 若两个列表均为空，退回使用 train_data_root / val_data_root（legacy 兼容模式）
  multi_train_roots:
    # ── processed_mini 多视角场景（cameras.json，随机3视角）──
    # - '/data/sifang/GPS_plus_data/processed_mini/enerf_outdoor/actor1_4/train'
    # - '/data/sifang/GPS_plus_data/processed_mini/enerf_outdoor/actor2_3/train'
    # - '/data/sifang/GPS_plus_data/processed_mini/mobile_stage/dance3/train'
    # - '/data/sifang/GPS_plus_data/processed_mini/my_zjumocap/my_313/train'
    # - '/data/sifang/GPS_plus_data/processed_mini/my_zjumocap/my_315/train'
    # - '/data/sifang/GPS_plus_data/processed_mini/NHR/basketball/train'
    # - '/data/sifang/GPS_plus_data/processed_mini/NHR/sport_1_easymocap/train'
    # - '/data/sifang/GPS_plus_data/processed_mini/renbody/0008_01/train'
    # - '/data/sifang/GPS_plus_data/processed_mini/renbody/0012_01/train'
    # ── processed_data 原始数据集（0_1.json + npy，固定 source=0,1）──
    - '/data/sifang/GPS_plus_data/processed_data/train'
  multi_val_roots:
    # - '/data/sifang/GPS_plus_data/processed_mini/enerf_outdoor/actor1_4/val'
    # - '/data/sifang/GPS_plus_data/processed_mini/enerf_outdoor/actor2_3/val'
    # - '/data/sifang/GPS_plus_data/processed_mini/mobile_stage/dance3/val'
    # - '/data/sifang/GPS_plus_data/processed_mini/my_zjumocap/my_313/val'
    # - '/data/sifang/GPS_plus_data/processed_mini/my_zjumocap/my_315/val'
    # - '/data/sifang/GPS_plus_data/processed_mini/NHR/basketball/val'
    # - '/data/sifang/GPS_plus_data/processed_mini/NHR/sport_1_easymocap/val'
    # - '/data/sifang/GPS_plus_data/processed_mini/renbody/0008_01/val'
    # - '/data/sifang/GPS_plus_data/processed_mini/renbody/0012_01/val'
    - '/data/sifang/GPS_plus_data/processed_data/val'
  # 对应格式，与 multi_train_roots 等长
  multi_formats:
    # - 'mini'
    # - 'mini'
    # - 'mini'
    # - 'mini'
    # - 'mini'
    - 'legacy'

  # 目标分辨率 (H, W)；null = 不 resize，保持原始尺寸
  # processed_mini 图片已经是 1024×1024，可设为 null 或调小加速训练
  target_hw: [512, 512]

  # __len__ 放大倍数
  train_boost: 5
  val_boost: 1

  # 随机选输入视角的相机间隔约束（mini 格式）
  # 太小 → 视图过近，深度估计退化；太大 → 重叠太少
  min_cam_gap: 1
  max_cam_gap: 3

  # legacy 格式的 novel view id（fixed source=0,1 时随机选的 novel）
  legacy_novel_ids: [2, 3, 4, 5]

# ───────────────────────────────────────────────
# RAFT 配置 (schema 兼容占位，PAGSplat 不使用)
# ───────────────────────────────────────────────
raft:
  mixed_precision: False
  train_iters: 3
  val_iters: 3
  encoder_dims: [32, 48, 96]
  hidden_dims: [96, 96, 96]
  n_downsample: 3
  n_gru_layers: 1
  slow_fast_gru: False
  corr_implementation: 'reg'
  corr_radius: 4
  corr_levels: 4
  context_norm: 'batch'

# ───────────────────────────────────────────────
# DA3 配置 (schema 兼容占位)
# ───────────────────────────────────────────────
da3:
  model_name: 'depth-anything/DA3-SMALL'
  mode: 'single'
  use_loftr: False
  finetune: False
  mixed_precision: False
  scale_factor: 1.0
  use_metric: False

# ───────────────────────────────────────────────
# GSNet 配置 (schema 兼容占位)
# ───────────────────────────────────────────────
gsnet:
  encoder_dims: [32, 48, 96]
  decoder_dims: [48, 64, 96]
  parm_head_dim: 32

# ───────────────────────────────────────────────
# PAGSplat 核心配置
# ───────────────────────────────────────────────
pagsplat:
  # DA3 预训练权重: HuggingFace repo id 或本地 .safetensors 路径
  # 示例: 'depth-anything/DA3-SMALL'
  #       '/data/sifang/Depth-Anything-3/checkpoints/da3-small.safetensors'
  da3_checkpoint: 'depth-anything/DA3-SMALL'

  # DINOv2 backbone embed_dim (由 build_pag_splat 自动从权重检测，此处仅作文档参考)
  # ViT-S: 384 | ViT-B: 768 | ViT-L: 1024 | ViT-G: 1536
  # DA3-SMALL 使用 ViT-S，embed_dim = 384
  embed_dim: 384

  # 内部统一特征通道数 (越大越强但更占显存)
  feat_channels: 256

  # 特征图下采样倍数 (推荐 4 → H/4 分辨率)
  feat_stride: 4

  # 从 DINOv2 第几层提取特征 (ViT-S 共 12 层，推荐 6~9)
  feat_layer: 8

  # ScaleAlignmentMLP 隐藏层维度
  mlp_hidden: 256

  # GaussianDecoder 通道配置
  # 内存受限时可改为 [64, 128, 256] / [64, 128, 256]
  enc_dims: [128, 256, 512]
  dec_dims: [128, 256, 512]

  # 预测头共享特征通道数 (与 GPS+ gsnet.parm_head_dim 对应)
  head_ch: 32

  # 高斯缩放上限 (保持像素级小高斯，与 GPS+ 一致)
  scale_max: 0.002

  # 是否使用混合精度 (建议 False 以保证数值稳定)
  mixed_precision: False

  # ── 辅助损失权重 ──
  # 边缘感知深度平滑: 防止深度图产生高频噪声
  loss_smooth: 0.001
  # 扭曲一致性: 惩罚无效扭曲区域的高不透明度
  loss_warp: 0.010

  # ── P0: 几何先验损失 (G3Splat 风格，抑制浮块/蚯蚓纹) ──
  # Scale 各向同性惩罚: 防止高斯退化为球形团块或蚯蚓状拉伸体
  # 鼓励扁平 surfel: s_min/s_max 比值越大越惩罚
  loss_scale: 0.05
  # 方向一致性: 高斯最短轴应与表面法线对齐
  # 初期训练可设为 0 逐步引入，稳定后调高
  loss_normal: 0.01

  # ── P1: 点云几何一致性 (GPS-Gaussian+ 和 Splat-SAP 均使用) ──
  # Chamfer Distance: 防止左右视图点云空间不一致引发的视角欺骗浮块
  loss_chamfer: 0.50
  # Chamfer 每次随机采样点数 (越大越准确但显存/速度代价越高)
  chamfer_samples: 5000

  # 渲染时不透明度裁剪阈值 (低于此值的点不参与渲染)
  min_opacity: 0.01

  # ── 迭代深度精化 (DepthGRUCell，参考 Splat-SAP Translation Module Eq.5) ──
  # GRU 迭代次数: 0 = 关闭 GRU（退回单次 delta_depth），3 = 推荐
  gru_iters: 3
  # GRU 隐藏状态通道数: 越大越强但显存更多
  gru_hidden_ch: 64

# ───────────────────────────────────────────────
# 训练记录配置
# ───────────────────────────────────────────────
record:
  loss_freq: 50      # 每 100 步打印一次 loss
  eval_freq: 500     # 每 3000 步做一次验证
  save_iter: 10000    # 每 10000 步保存一次 checkpoint
